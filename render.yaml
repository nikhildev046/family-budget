services:
  - type: web
    name: family-budget-api
    env: node
    region: oregon  # Choose: oregon, frankfurt, singapore (closest to you)
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    
    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 10000  # Render uses port 10000 by default
      
      - key: API_VERSION
        value: v1
      
      # Database (you'll set this in Render dashboard)
      - key: MONGODB_URI
        sync: false
      
      # JWT Secrets (auto-generate secure values)
      - key: JWT_SECRET
        generateValue: true
      
      - key: JWT_EXPIRE
        value: 7d
      
      - key: JWT_REFRESH_SECRET
        generateValue: true
      
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      
      # AWS Configuration (set in dashboard)
      - key: AWS_REGION
        value: us-east-1
      
      - key: AWS_ACCESS_KEY_ID
        sync: false
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      
      - key: S3_BUCKET_NAME
        sync: false
      
      - key: SQS_QUEUE_URL
        sync: false
      
      - key: SES_FROM_EMAIL
        sync: false
      
      - key: SES_REGION
        value: us-east-1
      
      # Frontend URL (update after deployment)
      - key: FRONTEND_URL
        value: http://localhost:3001
      
      - key: CORS_ORIGIN
        value: http://localhost:3001,https://family-budget-api.onrender.com
      
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      # File Upload
      - key: MAX_FILE_SIZE
        value: 5242880
      
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/jpg,application/pdf
      
      # AI (optional)
      - key: OPENAI_API_KEY
        sync: false
      
      - key: OPENAI_MODEL
        value: gpt-4
      
      # Monitoring
      - key: LOG_LEVEL
        value: info